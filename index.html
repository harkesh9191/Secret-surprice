<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0,
      maximum-scale=1.0, user-scalable=no">

<title>For You ❤️</title>

<style>

*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,
body{
  margin:0;
  padding:0;
  width:100%;
  min-height:100%;
}

body{
  font-family:Arial,sans-serif;
  background:linear-gradient(135deg,#ffdce8,#fff5f8);
  color:#542337;
  overflow:hidden;
}

.hidden{
  display:none !important;
}

.screen{
  width:100%;
  min-height:100vh;
  min-height:100dvh;

  padding:5px;

  display:flex;
  justify-content:center;
  align-items:center;

  overflow:hidden;
}

.card{
  width:100%;
  max-width:520px;

  min-height:98vh;
  min-height:98dvh;

  background:rgba(255,255,255,.97);

  border-radius:25px;

  padding:10px;

  text-align:center;

  box-shadow:
    0 15px 50px rgba(80,20,45,.16);

  display:flex;
  flex-direction:column;
  justify-content:center;

  overflow:visible;
}

button{
  border:0;
  border-radius:50px;

  padding:10px 18px;

  font-size:16px;
  font-weight:bold;

  cursor:pointer;

  touch-action:none;
  user-select:none;
}

.yes{
  background:#ff4f81;
  color:white;
}


/* =================================================
   CAT + BLANK PAPER
================================================= */

#paperArea{

  position:relative;

  width:100%;

  display:flex;
  justify-content:center;
  align-items:center;

  overflow:hidden;

  border-radius:20px;

  touch-action:none;
}


.catPaperImage{

  width:100%;
  height:auto;

  display:block;

  object-fit:contain;

}


/* =================================================
   QUESTION INSIDE BLANK
================================================= */

.paperContent{

  position:absolute;

  left:50%;
  top:62%;

  transform:translate(-50%,-50%);

  width:72%;

  text-align:center;

  z-index:100;

  pointer-events:none;
}


.proposalText{

  font-size:18px;

  font-weight:bold;

  line-height:1.25;

  margin:0 0 5px;

}


.answerText{

  font-size:12px;

  font-weight:bold;

  line-height:1.2;

  margin:0 0 8px;

}


/* =================================================
   YES + NO
   SAME LEVEL
================================================= */

.paperButtons{

  position:relative;

  width:100%;

  height:45px;

  display:flex;

  justify-content:center;

  align-items:center;

  gap:9px;

  z-index:200;

  pointer-events:auto;

}


/* YES stays normal */

#yesBtn{

  position:relative;

  z-index:300;

}


/* =================================================
   NO
   IMPORTANT:
   It starts BESIDE YES.
   It remains INSIDE paperArea.
================================================= */

#noBtn{

  position:relative;

  left:auto;
  top:auto;

  margin:0;

  background:#eeeeee;
  color:#555;

  white-space:nowrap;

  z-index:9999;

  opacity:1;
  visibility:visible;

  display:block;

  /*
    NO ko click/touch ke baad
    paper ke andar move karwayenge.
  */

}


/* =================================================
   MOBILE
================================================= */

@media(max-width:600px){

  .screen{

    padding:4px;

  }

  .card{

    padding:8px;

  }

  .paperContent{

    width:73%;

    top:62%;

  }

  .proposalText{

    font-size:15px;

  }

  .answerText{

    font-size:10px;

    margin-bottom:6px;

  }

  .paperButtons{

    height:40px;

    gap:7px;

  }

  .paperButtons button{

    font-size:13px;

    padding:8px 12px;

    min-width:68px;

  }

}


/* VERY SMALL PHONES */

@media(max-width:380px){

  .paperContent{

    width:75%;

    top:62%;

  }

  .proposalText{

    font-size:14px;

  }

  .answerText{

    font-size:9px;

  }

  .paperButtons{

    height:38px;

  }

  .paperButtons button{

    font-size:12px;

    padding:7px 10px;

    min-width:63px;

  }

}

</style>
</head>


<body>


<!-- =================================================
     PAGE 1
================================================= -->

<div
  class="screen"
  id="page1">

  <div class="card">


    <div id="paperArea">


      <!--
        APNI CAT IMAGE KA NAAM:

        cat-paper.jpg
      -->

      <img
        src="cat-paper.jpg"
        class="catPaperImage"
        alt="Cute cat holding blank paper">


      <!-- =================================================
           EVERYTHING BELOW IS INSIDE THE BLANK PAPER
      ================================================= -->

      <div class="paperContent">


        <div class="proposalText">

          Can I propose you? ❤️

        </div>


        <div class="answerText">

          Soch samajh ke answer dena 🥺❤️

        </div>


        <!-- YES + NO SAME LEVEL -->

        <div class="paperButtons">


          <button
            id="yesBtn"
            class="yes">

            YES ❤️

          </button>


          <button
            id="noBtn">

            NO 😭

          </button>


        </div>


      </div>

    </div>

  </div>

</div>



<script>


/* =================================================
   YES
================================================= */

document
.getElementById("yesBtn")
.addEventListener(
  "click",
  function(){

    /*
      Abhi sirf testing ke liye
      YES click par kuch nahi hoga.

      Next step mein isko
      Page 2 se connect karenge.
    */

  }
);


/* =================================================
   NO — PAPER KE ANDAR HI BHAGEGA
================================================= */

const noBtn =
  document.getElementById(
    "noBtn"
  );


const paperArea =
  document.getElementById(
    "paperArea"
  );


function moveNoInsidePaper(event){

  event.preventDefault();
  event.stopPropagation();


  /*
    Button ki current size
  */

  const buttonWidth =
    noBtn.offsetWidth;

  const buttonHeight =
    noBtn.offsetHeight;


  /*
    Paper/image ki actual visible size
  */

  const areaWidth =
    paperArea.clientWidth;

  const areaHeight =
    paperArea.clientHeight;


  /*
    Boundary ke andar thoda gap
  */

  const padding = 8;


  /*
    Maximum X/Y.
    NO kabhi paper ke bahar
    nahi jaayega.
  */

  const maxX =
    Math.max(
      padding,
      areaWidth -
      buttonWidth -
      padding
    );


  const maxY =
    Math.max(
      padding,
      areaHeight -
      buttonHeight -
      padding
    );


  /*
    Random position
  */

  const x =
    padding +
    Math.random() *
    Math.max(
      1,
      maxX - padding
    );


  const y =
    padding +
    Math.random() *
    Math.max(
      1,
      maxY - padding
    );


  /*
    IMPORTANT:
    NO ab paperArea ke relative
    absolute position mein rahega.
  */

  noBtn.style.position =
    "absolute";


  noBtn.style.left =
    x + "px";


  noBtn.style.top =
    y + "px";


  noBtn.style.right =
    "auto";


  noBtn.style.bottom =
    "auto";


  noBtn.style.margin =
    "0";


  noBtn.style.opacity =
    "1";


  noBtn.style.visibility =
    "visible";

}


/* =================================================
   MOBILE + DESKTOP
================================================= */

noBtn.addEventListener(
  "pointerdown",
  moveNoInsidePaper,
  {
    passive:false
  }
);


/*
  Extra touch protection.
*/

noBtn.addEventListener(
  "touchstart",
  moveNoInsidePaper,
  {
    passive:false
  }
);


/*
  NO click hone par page change
  nahi hoga.
*/

noBtn.addEventListener(
  "click",
  function(event){

    event.preventDefault();
    event.stopPropagation();

  },
  {
    passive:false
  }
);

</script>

</body>
</html>
