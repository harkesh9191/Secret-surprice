<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>A Little Surprise 💗</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  width:100%;
  height:100vh;
  overflow:hidden;
  font-family:Arial,sans-serif;
  background:#08000d;
  color:white;
}

#app{
  width:100%;
  height:100vh;
  position:relative;
  overflow:hidden;
}

.screen{
  position:absolute;
  inset:0;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  text-align:center;
  transition:1s ease;
}

.hidden{
  opacity:0;
  pointer-events:none;
  transform:scale(1.15);
}

/* INTRO */
#intro{
  background:
    radial-gradient(circle at center,#4b123f 0%,#18071d 45%,#050008 100%);
}

.small{
  font-size:15px;
  letter-spacing:4px;
  opacity:.7;
  margin-bottom:18px;
}

h1{
  font-size:clamp(32px,9vw,70px);
  line-height:1.1;
  margin-bottom:12px;
  text-shadow:0 0 25px #ff4fa3;
}

.subtitle{
  font-size:16px;
  opacity:.75;
  margin-bottom:40px;
}

.start{
  padding:15px 32px;
  border:1px solid #ff75b9;
  border-radius:50px;
  background:#ff3f91;
  color:white;
  font-size:17px;
  cursor:pointer;
  box-shadow:0 0 30px #ff3f9166;
}

/* PROPOSAL */
#proposal{
  background:
    radial-gradient(circle at center,#5b174b,#180817 48%,#050008);
}

.question{
  font-size:clamp(28px,8vw,58px);
  margin-bottom:45px;
}

.doors{
  display:flex;
  gap:25px;
}

.door{
  width:135px;
  height:190px;
  border-radius:12px;
  background:linear-gradient(145deg,#7d275d,#2c0b27);
  border:2px solid #ff80bf;
  box-shadow:0 0 25px #ff3f9155;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  cursor:pointer;
  transition:.3s;
}

.door:hover{
  transform:translateY(-8px);
  box-shadow:0 0 40px #ff4fa3aa;
}

.knob{
  width:10px;
  height:10px;
  background:#ffd6e9;
  border-radius:50%;
  margin-bottom:25px;
}

.door span{
  font-size:22px;
  font-weight:bold;
}

.hint{
  margin-top:25px;
  opacity:.6;
  font-size:13px;
}

/* YES */
#yesScreen{
  background:
    radial-gradient(circle,#7b174f,#26091f 50%,#08000d);
}

.welcome{
  font-size:clamp(30px,9vw,65px);
  font-weight:bold;
  animation:pulse 1.5s infinite;
}

.heart{
  position:absolute;
  font-size:25px;
  animation:fall linear forwards;
  top:-50px;
}

@keyframes pulse{
  0%,100%{transform:scale(1)}
  50%{transform:scale(1.08)}
}

@keyframes fall{
  to{
    transform:translateY(115vh) rotate(360deg);
    opacity:0;
  }
}

/* NO */
#noScreen{
  background:#050505;
}

.bye{
  font-size:clamp(45px,12vw,90px);
}

.back{
  margin-top:25px;
  padding:12px 25px;
  border:1px solid #555;
  border-radius:30px;
  background:transparent;
  color:white;
}
</style>
</head>

<body>

<div id="app">

  <!-- INTRO -->
  <section id="intro" class="screen">
    <div class="small">A LITTLE SURPRISE</div>
    <h1>Someone has a question<br>for you... 💗</h1>
    <div class="subtitle">Tap the button when you're ready.</div>
    <button class="start" onclick="openProposal()">Open the surprise ✨</button>
  </section>

  <!-- PROPOSAL -->
  <section id="proposal" class="screen hidden">
    <div class="small">JUST ONE QUESTION</div>

    <div class="question">
      Can I propose you? 💗
    </div>

    <div class="doors">

      <div class="door" onclick="sayYes()">
        <div class="knob"></div>
        <span>YES 💗</span>
      </div>

      <div class="door" onclick="sayNo()">
        <div class="knob"></div>
        <span>NO 👋</span>
      </div>

    </div>

    <div class="hint">Choose one door...</div>
  </section>

  <!-- YES -->
  <section id="yesScreen" class="screen hidden">
    <div class="welcome">
      YOUR MOST WELCOME<br>
      MADAM 💗
    </div>
  </section>

  <!-- NO -->
  <section id="noScreen" class="screen hidden">
    <div class="bye">BYE 👋</div>
  </section>

</div>

<script>

function openProposal(){
  document.getElementById("intro").classList.add("hidden");

  setTimeout(()=>{
    document.getElementById("proposal").classList.remove("hidden");
  },500);
}

function sayYes(){
  document.getElementById("proposal").classList.add("hidden");

  setTimeout(()=>{
    document.getElementById("yesScreen").classList.remove("hidden");
    createHearts();
  },500);
}

function sayNo(){
  document.getElementById("proposal").classList.add("hidden");

  setTimeout(()=>{
    document.getElementById("noScreen").classList.remove("hidden");
  },500);
}

function createHearts(){

  for(let i=0;i<45;i++){

    let heart=document.createElement("div");

    heart.className="heart";
    heart.innerHTML=["❤️","💗","💕","💖","💘"][Math.floor(Math.random()*5)];

    heart.style.left=Math.random()*100+"vw";
    heart.style.animationDuration=(3+Math.random()*4)+"s";
    heart.style.animationDelay=Math.random()*2+"s";

    document.getElementById("yesScreen").appendChild(heart);
  }
}

</script>

</body>
</html>
